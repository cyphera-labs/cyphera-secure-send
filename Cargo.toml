[package]
name = "cyphera-secure-send"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "One-time secret handoff for controlled environments. Client-side encryption, ephemeral in-memory storage, one binary."
license = "Apache-2.0"
repository = "https://github.com/cyphera-labs/cyphera-secure-send"
homepage = "https://cyphera.io"
authors = ["Leslie Gutschow <leslie.gutschow@horizondigital.dev>"]
publish = false

[[bin]]
name = "cyphera-secure-send"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
axum-extra = { version = "0.12", features = ["cookie"] }
axum = { version = "0.8", features = ["form", "http1", "http2", "json", "query", "tokio", "macros"], default-features = false }
axum-server = { version = "0.8", features = ["tls-rustls"] }
clap = { version = "4", features = ["derive"] }
config = { version = "0.15", default-features = false, features = ["yaml"] }
data-encoding = "2"
getrandom = "0.4"
governor = "0.10"
ipnet = { version = "2", features = ["serde"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
mime_guess = "2"
moka = { version = "0.12", features = ["future"] }
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
redis = { version = "1", default-features = false, features = ["tokio-rustls-comp", "tls-rustls-webpki-roots", "connection-manager", "script"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rust-embed = { version = "8", features = ["include-exclude"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
thiserror = "2"
time = { version = "0.3", features = ["serde-well-known", "formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time", "fs"] }
tower-http = { version = "0.7", features = ["timeout"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "http2"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
url = "2"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
proptest = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }
rsa = { version = "0.9", features = ["pem"] }
tokio = { version = "1", features = ["full", "test-util"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = 3
