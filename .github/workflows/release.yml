name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
          - target: aarch64-unknown-linux-gnu
            arch: arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cross --locked
      - run: cross build --release --locked --target ${{ matrix.target }}
      - run: |
          mkdir -p out
          cp target/${{ matrix.target }}/release/cyphera-secure-send out/cyphera-secure-send-linux-${{ matrix.arch }}
          cd out && sha256sum cyphera-secure-send-linux-${{ matrix.arch }} > cyphera-secure-send-linux-${{ matrix.arch }}.sha256
      - uses: actions/upload-artifact@v5
        with:
          name: binary-${{ matrix.arch }}
          path: out/*

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-cyclonedx --locked
      - run: cargo cyclonedx --format json --override-filename cyphera-secure-send.cyclonedx
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: cyphera-secure-send.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@v5
        with:
          name: sbom
          path: |
            cyphera-secure-send.cyclonedx.json
            cyphera-secure-send.spdx.json

  container:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish:
    runs-on: ubuntu-latest
    needs: [binaries, sbom, container]
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - uses: sigstore/cosign-installer@v3
      - run: |
          cd dist
          for f in cyphera-secure-send-linux-*; do
            case "$f" in *.sha256|*.sig|*.pem) continue;; esac
            cosign sign-blob --yes --output-signature "$f.sig" --output-certificate "$f.pem" "$f"
          done
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/cyphera-secure-send-linux-*
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: false
          body: |
            Container: `${{ env.IMAGE }}@${{ needs.container.outputs.digest }}`

            Every file is signed with Sigstore (`.sig` + `.pem`), and a build provenance
            attestation is attached. Verify a binary with:

                cosign verify-blob --certificate FILE.pem --signature FILE.sig \
                  --certificate-identity-regexp 'https://github.com/${{ github.repository }}/' \
                  --certificate-oidc-issuer https://token.actions.githubusercontent.com FILE
