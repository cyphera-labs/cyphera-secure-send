name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  binaries:
    name: Binaries (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
          - target: aarch64-unknown-linux-gnu
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund && npm run build
        working-directory: web
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cross@0.2.5
      - run: cross build --release --locked --target ${{ matrix.target }}
      - run: |
          mkdir -p out
          cp target/${{ matrix.target }}/release/cyphera-secure-send out/cyphera-secure-send-linux-${{ matrix.arch }}
          cd out && sha256sum cyphera-secure-send-linux-${{ matrix.arch }} > cyphera-secure-send-linux-${{ matrix.arch }}.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.arch }}
          path: out/*

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-cyclonedx@0.5.9
      - run: cargo cyclonedx --format json --override-filename "cyphera-secure-send-${REF_NAME}-sbom.cyclonedx"
        env:
          REF_NAME: ${{ github.ref_name }}
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: cyphera-secure-send-${{ github.ref_name }}-sbom.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: cyphera-secure-send-*-sbom.*.json

  container:
    name: Container image
    runs-on: ubuntu-latest
    # The image carries the binaries built above rather than compiling again,
    # so the other architecture costs a file copy instead of an emulated
    # toolchain, and the image holds exactly what was signed.
    needs: binaries
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: push
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      version: ${{ steps.package.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: helm lint deploy/helm/securesend
      - name: Version the chart from the tag
        id: package
        run: |
          version="${REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          helm package deploy/helm/securesend --version "$version" --app-version "$version" --destination out
        env:
          REF_NAME: ${{ github.ref_name }}
      # Two logins because two credential stores: helm keeps its own under
      # its config directory, and cosign reads the Docker one. The chart is
      # pushed by the first and signed by the second.
      - run: echo "${GITHUB_TOKEN}" | helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the chart and record its digest
        id: push
        run: |
          out="$(helm push out/securesend-*.tgz "oci://ghcr.io/${REPO_OWNER}/charts" 2>&1)"
          echo "$out"
          digest="$(printf '%s\n' "$out" | sed -n 's/^Digest: //p')"
          if [ -z "$digest" ]; then
            echo "helm push printed no digest, so there is nothing to sign" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
        env:
          REPO_OWNER: ${{ github.repository_owner }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: cosign sign --yes "ghcr.io/${REPO_OWNER}/charts/securesend@${DIGEST}"
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          DIGEST: ${{ steps.push.outputs.digest }}

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [binaries, sbom, container, chart]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: |
            dist/cyphera-secure-send-linux-*
            dist/cyphera-secure-send-*-sbom.*.json
      - run: cp "${BUNDLE_PATH}" "dist/cyphera-secure-send-${REF_NAME}-provenance.intoto.jsonl"
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          REF_NAME: ${{ github.ref_name }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: |
          cd dist
          for f in cyphera-secure-send-linux-* cyphera-secure-send-*-sbom.*.json; do
            case "$f" in *.sha256|*.sigstore.json) continue;; esac
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: false
          # A tag carrying a hyphen is a candidate, not a release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Container: `${{ env.IMAGE }}@${{ needs.container.outputs.digest }}`
            Helm chart: `oci://ghcr.io/${{ github.repository_owner }}/charts/securesend` version `${{ needs.chart.outputs.version }}`

            Binaries and SBOMs are signed with Sigstore; each carries a
            `.sigstore.json` bundle beside it, and a build provenance attestation
            bundle (`.intoto.jsonl`) is attached. Verify a file with:

                cosign verify-blob --bundle FILE.sigstore.json \
                  --certificate-identity-regexp 'https://github.com/${{ github.repository }}/' \
                  --certificate-oidc-issuer https://token.actions.githubusercontent.com FILE

            Verify the image with:

                cosign verify ${{ env.IMAGE }}@${{ needs.container.outputs.digest }} \
                  --certificate-identity-regexp 'https://github.com/${{ github.repository }}/' \
                  --certificate-oidc-issuer https://token.actions.githubusercontent.com

            The chart is signed the same way. Its digest is `${{ needs.chart.outputs.digest }}`; verify it with:

                cosign verify ghcr.io/${{ github.repository_owner }}/charts/securesend@${{ needs.chart.outputs.digest }} \
                  --certificate-identity-regexp 'https://github.com/${{ github.repository }}/' \
                  --certificate-oidc-issuer https://token.actions.githubusercontent.com
