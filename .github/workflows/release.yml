name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  binaries:
    name: Binaries (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
          - target: aarch64-unknown-linux-gnu
            arch: arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: web
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cross
      - run: cross build --release --locked --target ${{ matrix.target }}
      - run: |
          mkdir -p out
          cp target/${{ matrix.target }}/release/cyphera-secure-send out/cyphera-secure-send-linux-${{ matrix.arch }}
          cd out && sha256sum cyphera-secure-send-linux-${{ matrix.arch }} > cyphera-secure-send-linux-${{ matrix.arch }}.sha256
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: binary-${{ matrix.arch }}
          path: out/*

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-cyclonedx
      - run: cargo cyclonedx --format json --override-filename "cyphera-secure-send-${REF_NAME}-sbom.cyclonedx"
        env:
          REF_NAME: ${{ github.ref_name }}
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: cyphera-secure-send-${{ github.ref_name }}-sbom.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: sbom
          path: cyphera-secure-send-*-sbom.*.json

  container:
    name: Container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        id: push
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [binaries, sbom, container]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        id: attest
        with:
          subject-path: |
            dist/cyphera-secure-send-linux-*
            dist/cyphera-secure-send-*-sbom.*.json
      - run: cp "${BUNDLE_PATH}" "dist/cyphera-secure-send-${REF_NAME}-provenance.intoto.jsonl"
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          REF_NAME: ${{ github.ref_name }}
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - run: |
          cd dist
          for f in cyphera-secure-send-linux-* cyphera-secure-send-*-sbom.*.json; do
            case "$f" in *.sha256|*.sig|*.pem) continue;; esac
            cosign sign-blob --yes --output-signature "$f.sig" --output-certificate "$f.pem" "$f"
          done
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: false
          body: |
            Container: `${{ env.IMAGE }}@${{ needs.container.outputs.digest }}`

            Binaries and SBOMs are signed with Sigstore (`.sig` + `.pem`), and a build
            provenance attestation bundle (`.intoto.jsonl`) is attached. Verify a file with:

                cosign verify-blob --certificate FILE.pem --signature FILE.sig \
                  --certificate-identity-regexp 'https://github.com/${{ github.repository }}/' \
                  --certificate-oidc-issuer https://token.actions.githubusercontent.com FILE

            Verify the image with:

                cosign verify ${{ env.IMAGE }}@${{ needs.container.outputs.digest }} \
                  --certificate-identity-regexp 'https://github.com/${{ github.repository }}/' \
                  --certificate-oidc-issuer https://token.actions.githubusercontent.com
