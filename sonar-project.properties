# Analysis configuration. The CI job skips itself until a SONAR_TOKEN secret
# exists, and the quality-gate and coverage badges belong in the README only
# once the project has been created.
sonar.organization=cyphera-labs
sonar.projectKey=cyphera-labs_cyphera-secure-send
sonar.projectName=Cyphera SecureSend

sonar.sources=src,web/src
sonar.tests=tests,web/e2e
sonar.test.inclusions=web/src/**/*.test.ts
# azuredeploy.json is compiled from main.bicep and checked in so the Deploy
# to Azure button has something to point at; CI verifies it matches. Analyze
# the source, not the artifact.
sonar.exclusions=web/dist/**,target/**,web/node_modules/**,deploy/azure/azuredeploy.json
sonar.sourceEncoding=UTF-8

sonar.rust.clippy.reportPaths=target/clippy.json
sonar.rust.lcov.reportPaths=target/lcov.info
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
sonar.typescript.tsconfigPaths=web/tsconfig.json
