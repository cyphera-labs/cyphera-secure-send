sonar.organization=cyphera-labs
sonar.projectKey=cyphera-labs_cyphera-secure-send
sonar.projectName=Cyphera SecureSend
sonar.projectVersion=0.1.0

sonar.sources=src,web/src
sonar.tests=tests,web/e2e
sonar.test.inclusions=web/src/**/*.test.ts
sonar.exclusions=web/dist/**,target/**,web/node_modules/**
sonar.sourceEncoding=UTF-8

sonar.rust.clippy.reportPaths=target/clippy.json
sonar.rust.lcov.reportPaths=target/lcov.info
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
sonar.typescript.tsconfigPaths=web/tsconfig.json
