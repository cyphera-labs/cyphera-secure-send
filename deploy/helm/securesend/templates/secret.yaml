{{- if and (eq .Values.storage.backend "redis") (not .Values.storage.redis.existingSecret) }}
{{- if not .Values.storage.redis.url }}
{{- fail "securesend: storage.backend redis needs storage.redis.url or storage.redis.existingSecret" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "securesend.redisSecretName" . }}
  labels:
    {{- include "securesend.labels" . | nindent 4 }}
type: Opaque
stringData:
  url: {{ .Values.storage.redis.url | quote }}
---
{{- end }}
{{- if and (eq .Values.mode "enterprise") (not .Values.oidc.existingSecret) }}
{{- if not .Values.oidc.clientSecret }}
{{- fail "securesend: mode enterprise needs oidc.clientSecret or oidc.existingSecret" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "securesend.oidcSecretName" . }}
  labels:
    {{- include "securesend.labels" . | nindent 4 }}
type: Opaque
stringData:
  client-secret: {{ .Values.oidc.clientSecret | quote }}
{{- end }}
