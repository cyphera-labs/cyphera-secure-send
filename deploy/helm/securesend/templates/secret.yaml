{{- if and (eq (index .Values.config "auth" "mode") "oidc") (not .Values.oidc.existingSecret) }}
{{- if not .Values.oidc.clientSecret }}
{{- fail "securesend: auth.mode oidc needs oidc.clientSecret or oidc.existingSecret" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "securesend.oidcSecretName" . }}
  labels:
    {{- include "securesend.labels" . | nindent 4 }}
type: Opaque
stringData:
  client-secret: {{ .Values.oidc.clientSecret | quote }}
{{- end }}
